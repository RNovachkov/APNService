name: Build and Publish to NuGet (Auto-Version)

on:
  push:
    branches: [ publish ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

env:
  # The package project to pack and publish.
  PACKAGE_PROJECT: APNService/APNService.csproj
  # The test project (also builds APNCore + APNService transitively).
  TEST_PROJECT: tests/APNService.Tests/APNService.Tests.csproj

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for version calculation / tagging

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Get Version from .csproj
      id: get_version
      run: |
        echo "Looking for APNService.csproj..."
        find . -name "APNService.csproj" -type f

        # Find the package .csproj file.
        CSPROJ_FILE=$(find . -name "APNService.csproj" -type f | head -n 1)

        if [ -z "$CSPROJ_FILE" ]; then
          echo "Error: No APNService.csproj file found"
          VERSION="10.0.0"
        else
          echo "Using .csproj file: $CSPROJ_FILE"

          # Read version directly from the found .csproj file.
          VERSION=$(grep -oP '<Version>\K[^<]+' "$CSPROJ_FILE" | head -n 1)

          # If Version tag not found, try VersionPrefix.
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -oP '<VersionPrefix>\K[^<]+' "$CSPROJ_FILE" | head -n 1)
          fi

          # Final fallback.
          if [ -z "$VERSION" ]; then
            VERSION="10.0.0"
            echo "Warning: No version found in $CSPROJ_FILE, using default $VERSION"
          fi
        fi

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Project version: $VERSION"

    - name: Restore dependencies
      run: dotnet restore "$TEST_PROJECT"

    - name: Build
      run: dotnet build "$TEST_PROJECT" --configuration Release --no-restore

    - name: Test
      run: dotnet test "$TEST_PROJECT" --no-build --verbosity normal --configuration Release

    - name: Pack
      run: dotnet pack "$PACKAGE_PROJECT" --configuration Release --output ./artifacts

    - name: Publish to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Create Git Tag
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag "v${{ steps.get_version.outputs.version }}"
        git push origin "v${{ steps.get_version.outputs.version }}"
